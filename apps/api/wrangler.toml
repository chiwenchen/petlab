name = "petlab-api"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain (set up via Cloudflare dashboard or `wrangler deploy`)
# routes = [{ pattern = "api.petlab.redarch.dev", custom_domain = true }]

[vars]
APP_NAME = "PetLab"
WEB_VIEWER_BASE = "https://petlab.redarch.dev"
OTP_TTL_SECONDS = "600"
JWT_TTL_SECONDS = "7776000"  # 90 days

# D1 — run `wrangler d1 create petlab` then paste database_id below
[[d1_databases]]
binding = "DB"
database_name = "petlab"
database_id = "REPLACE_ME"

# R2 — run `wrangler r2 bucket create petlab-images`
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "petlab-images"

# Secrets to set with `wrangler secret put`:
#   ANTHROPIC_API_KEY  — for OCR (Phase 2)
#   RESEND_API_KEY     — for email OTP
#   JWT_SECRET         — random string, sign session JWTs
#   OTP_FROM_EMAIL     — e.g. "PetLab <noreply@redarch.dev>"
